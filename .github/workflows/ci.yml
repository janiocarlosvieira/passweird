name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # Windows is in the matrix on purpose: it is one of the two platforms this
    # project is distributed for, and it is what actually verifies the ANSI/
    # colorama fix and general Windows path handling instead of assuming them.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GnuPG (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnupg

      # --pgp is exercised only when a gpg binary is on PATH (tests skip
      # otherwise, see tests/test_cli.py::test_pgp_flag) - no Windows GnuPG
      # setup here, matching that every install is opt-in via the `pgp` extra.

      - name: Install passweird with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v

      # Catches a derivation change that was made without regenerating the golden
      # vectors - i.e. a silent compatibility break for every already-deployed
      # password. See tests/vectors/README.md and ADR-0008.
      - name: Verify the golden vectors are up to date
        run: python tools/generate_vectors.py --check

      - name: Verify the console script resolves
        run: passweird --help

  # The Kotlin core is a second implementation of the same specification
  # (ADR-0008). Running its vector suite here is what makes the golden vectors a
  # shared contract rather than two suites that happen to agree locally: a change
  # landing in one language without the other now fails the build.
  #
  # Linux only. The core is pure JVM with no OS-dependent behaviour, and the
  # Python job above already covers the Windows-specific concerns.
  kotlin-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"      # AGP 8.7 requires 17+

      # Needed even for jvmTest: the com.android.library plugin has to resolve
      # the SDK at configuration time, before any target is selected.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the golden vector suite against the Kotlin core
        run: ./gradlew --no-daemon :passweird-core:jvmTest

      - name: Build the Android library artifact
        run: ./gradlew --no-daemon :passweird-core:assembleRelease

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: kotlin/passweird-core/build/reports/tests/
