name: Publish to PyPI

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Uses PyPI Trusted Publishing (OIDC) instead of a stored API token - no
# long-lived secret lives in this repository. Before the first run, the
# project owner must register this workflow as a trusted publisher on
# https://pypi.org/manage/project/passweird/settings/publishing/
# (or, for a project that doesn't exist on PyPI yet, as a "pending publisher"
# at https://pypi.org/manage/account/publishing/) - that one-time setup can
# only be done by whoever owns the PyPI account, not from CI.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
